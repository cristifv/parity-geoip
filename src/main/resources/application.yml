spring:
  application:
    name: parity-geoip
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: parity-geoip
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        # Each response is sent on its own and waited for: don't hold it back for a batch
        # (Kafka 4 clients wait 5 ms by default).
        linger.ms: 0
    listener:
      # A request's offset is committed after its response is written.
      ack-mode: record

parity-geoip:
  topics:
    requests: geoip.requests
    responses: geoip.responses
  databases:
    # MaxMind GeoLite2 City (or GeoIP2 City). Required.
    city: /usr/share/GeoIP/GeoLite2-City.mmdb
    # MaxMind GeoLite2 ASN. Optional: leave empty for no asn / as_org in lookups.
    asn: ""
  # The zones that nearest_zone picks from, ranked by distance from the IP's location.
  # Empty: lookups have no nearest_zone. For example:
  #   zones:
  #     - {name: eu1, lat: 50.11, lon: 8.68}
  #     - {name: us1, lat: 39.04, lon: -77.49}
  zones: []
  lifecycle:
    healthy-file: /tmp/${spring.application.name}.healthy
    drained-file: /tmp/${spring.application.name}.drained
    drain-timeout: 30s

logging:
  level:
    org.apache.kafka: warn
